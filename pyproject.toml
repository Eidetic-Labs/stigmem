[project]
name = "stigmem"
version = "0.9.0a10"
description = "Stigmem — federated knowledge fabric for AI agents (meta-package)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Eidetic Labs", email = "oss@eidetic-labs.ai" },
]
keywords = ["stigmem", "federation", "memory", "ai", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# `pip install stigmem` → installs the Python SDK (most common adopter path).
# Operators self-hosting a node use `pip install stigmem[node]` or
# `pip install stigmem-node` directly. See the install table below for extras.
dependencies = [
  "stigmem-py>=0.9.0a10,<1.0.0",
]

[project.optional-dependencies]
# pip install stigmem[node] → SDK + reference node service
node = ["stigmem-node>=0.9.0a10,<1.0.0"]
# pip install stigmem[openclaw] → SDK + OpenClaw adapter
openclaw = ["stigmem-openclaw>=0.9.0a10,<1.0.0"]
# pip install stigmem[<feature>] → SDK + one published experimental plugin
cognee-adapter = [
  "stigmem-plugin-cognee-adapter>=0.1.0,<2.0.0",
]
gemini-adapter = [
  "stigmem-plugin-gemini-adapter>=0.1.0,<2.0.0",
]
letta-adapter = [
  "stigmem-plugin-letta-adapter>=0.1.0,<2.0.0",
]
openai-tools-adapter = [
  "stigmem-plugin-openai-tools-adapter>=0.1.0,<2.0.0",
]
zep-adapter = [
  "stigmem-plugin-zep-adapter>=0.1.0,<2.0.0",
]
# pip install stigmem[adapters] -> SDK + host-application adapter plugins
adapters = [
  "stigmem-plugin-cognee-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-gemini-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-letta-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-openai-tools-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-zep-adapter>=0.1.0,<2.0.0",
]
lazy-instruction-discovery = [
  "stigmem-plugin-lazy-instruction-discovery>=0.1.0,<2.0.0",
]
memory-garden-acl = [
  "stigmem-plugin-memory-garden-acl>=0.1.0,<2.0.0",
]
multi-tenant = [
  "stigmem-plugin-multi-tenant>=0.1.0,<2.0.0",
]
source-attestation = [
  "stigmem-plugin-source-attestation>=0.1.0,<2.0.0",
]
time-travel = [
  "stigmem-plugin-time-travel>=0.1.0,<2.0.0",
]
tombstones = [
  "stigmem-plugin-tombstones>=0.1.0,<2.0.0",
]
# pip install stigmem[plugins-all] → SDK + all currently published experimental plugins
plugins-all = [
  "stigmem-plugin-cognee-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-gemini-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-letta-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-openai-tools-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-zep-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-lazy-instruction-discovery>=0.1.0,<2.0.0",
  "stigmem-plugin-memory-garden-acl>=0.1.0,<2.0.0",
  "stigmem-plugin-multi-tenant>=0.1.0,<2.0.0",
  "stigmem-plugin-source-attestation>=0.1.0,<2.0.0",
  "stigmem-plugin-time-travel>=0.1.0,<2.0.0",
  "stigmem-plugin-tombstones>=0.1.0,<2.0.0",
]
# pip install stigmem[all] → everything published from this monorepo
all = [
  "stigmem-node>=0.9.0a10,<1.0.0",
  "stigmem-openclaw>=0.9.0a10,<1.0.0",
  "stigmem-plugin-cognee-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-gemini-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-letta-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-openai-tools-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-zep-adapter>=0.1.0,<2.0.0",
  "stigmem-plugin-lazy-instruction-discovery>=0.1.0,<2.0.0",
  "stigmem-plugin-memory-garden-acl>=0.1.0,<2.0.0",
  "stigmem-plugin-multi-tenant>=0.1.0,<2.0.0",
  "stigmem-plugin-source-attestation>=0.1.0,<2.0.0",
  "stigmem-plugin-time-travel>=0.1.0,<2.0.0",
  "stigmem-plugin-tombstones>=0.1.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/eidetic-labs/stigmem"
Documentation = "https://docs.stigmem.dev"
Repository = "https://github.com/eidetic-labs/stigmem"
Issues = "https://github.com/eidetic-labs/stigmem/issues"
Changelog = "https://github.com/eidetic-labs/stigmem/blob/main/CHANGELOG.md"

# stigmem is a meta-package: it carries no Python code of its own.
# `[tool.setuptools] packages = []` tells setuptools "no Python packages to
# bundle" — the wheel is intentionally empty. The point of this distribution
# is to claim the canonical `stigmem` name on PyPI and make `pip install stigmem`
# resolve to the right collection of real packages via dependencies + extras.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv.workspace]
# Per ADR-002 v1 critical-path scope + ADR-020 repository contracts: only critical-path
# packages in the default workspace. Only explicitly listed experimental
# packages are included here, so default `uv sync` does not pull deferred
# experimental dependencies. Operators who want another experimental feature
# install its package explicitly via `pip install stigmem-plugin-<feature>` or
# by adding the experimental/<feature>/ path to their workspace.
members = [
  "node",
  "sdks/stigmem-py",
  "adapters/openclaw",
  "experimental/cognee-adapter",
  "experimental/gemini-adapter",
  "experimental/letta-adapter",
  "experimental/openai-tools-adapter",
  "experimental/zep-adapter",
]

[tool.uv.sources]
stigmem-node = { workspace = true }
stigmem-py = { workspace = true }
stigmem-openclaw = { workspace = true }
stigmem-plugin-cognee-adapter = { workspace = true }
stigmem-plugin-gemini-adapter = { workspace = true }
stigmem-plugin-letta-adapter = { workspace = true }
stigmem-plugin-openai-tools-adapter = { workspace = true }
stigmem-plugin-zep-adapter = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "hypothesis>=6.100",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["node/tests", "sdks/stigmem-py/tests", "node/src/stigmem_conformance/tests"]
pythonpath = ["node/tests", "sdks/stigmem-py/tests"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
  "unit: isolated package-level tests without external services",
  "integration: multi-module or HTTP-level tests against a local app/runtime",
  "conformance: wire-contract and versioned vector coverage",
  "postgres: tests that require a PostgreSQL backend",
  "libsql: tests that require a libSQL backend",
  "docker: tests that require Docker or containerized dependencies",
  "eval: adversarial or recall evaluation suites",
  "security: adversarial vectors and threat-model regression tests",
  "experimental: tests for features in experimental/ (excluded from default CI unless explicitly selected)",
  "slow: tests intentionally excluded from fast PR loops",
  "network: tests that require outbound network access",
]

[tool.coverage.run]
source = ["node/src", "sdks/stigmem-py/src"]
branch = true
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "coverage/python/htmlcov"
title = "Stigmem Python coverage"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
